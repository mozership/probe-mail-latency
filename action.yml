# It declares allow-host, as the action connects to no host, and not
# read-only, as it writes its CSV into output_dir.
name: mail-latency
description: Measure mail delivery latency from a Maildir
guard: [allow-host]
params: [mail_dir, output_dir]
runs:
  using: binary
  url: https://github.com/mozership/probe-mail-latency/releases/download/v0.1.1/probe-mail-latency_{os}_{arch}
  checksums:
    darwin_amd64: "30eeac3da5e75c51a3b60d7c18d9d64e4e9dc005ddd82e4473e32f4b86d1f466"
    darwin_arm64: "9d51bc3b34c3e34fe2c9968be0639325598c15bad06b6b7fc9392973f6a857b1"
    linux_amd64: "7cbec24cfaf5d6b387b36021b17864ea04db16d70a606e03911302def0bebd8c"
    linux_arm64: "120936760ce264975b587e38ff5fc4e2e1cde487c1e51b48164c54d44a428998"
