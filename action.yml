# It declares allow-host, as the action connects to no host, and not
# read-only, as it writes its CSV into output_dir.
name: mail-latency
description: Measure mail delivery latency from a Maildir
guard: [allow-host]
params: [mail_dir, output_dir]
runs:
  using: binary
  url: https://github.com/mozership/probe-mail-latency/releases/download/v0.1.3/probe-mail-latency_{os}_{arch}
  checksums:
    darwin_amd64: "d6298d9f0c082f5db8dcb2169d9730fa6d9cb4e51eeeeae225f94c0ce8a9c33e"
    darwin_arm64: "5ce36ef08b924fb24a6244d77deab67bc909a654dc5ce93d172ec0e8c46149f0"
    linux_amd64: "b8d966e22f70035d0cccd38b23f72904292bb9fd944378620cfab5f97c68dd65"
    linux_arm64: "cf9beacedd73312f3036d73cfe30e73dcc93b272d5d1c92003a741e46f15b742"
