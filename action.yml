# It declares allow-host, as the action connects to no host, and not
# read-only, as it writes its CSV into output_dir.
name: mail-latency
description: Measure mail delivery latency from a Maildir
guard: [allow-host]
params: [mail_dir, output_dir]
runs:
  using: binary
  url: https://github.com/mozership/probe-mail-latency/releases/download/v0.1.2/probe-mail-latency_{os}_{arch}
  checksums:
    darwin_amd64: "42bfb4d94f38e0ac660b93bbeb0a3c4bf34fced0bef45655924ad2496f33f068"
    darwin_arm64: "219696789fd01629bcf748a83f27eed2aee52806c260e4c213335e963252ba75"
    linux_amd64: "c11c76c1b24e88dcedbbed66cefe5453fd45fed367fc6d2b61c932e23635b02c"
    linux_arm64: "20797fc5bc60e6fc365db58dd181456f229a792d2d6f17c1ce4cf204a10dc20f"
