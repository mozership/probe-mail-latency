name: Test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  # The tests above call the package. This one runs the action through Probe,
  # under --allow-host, against the Maildir in maillatency/testdata.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      # Probe resolves the action before the first job of a workflow, so it
      # is built first.
      - run: go build -o e2e/action/probe-mail-latency .
      # The probe the e2e workflow runs, checked against the digest of its
      # release before anything runs from it.
      - name: Download Probe
        run: |
          gh release download "$PROBE_VERSION" -R mozership/probe -p probe_linux_x86_64.tar.gz -p checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar xzf probe_linux_x86_64.tar.gz probe
          ./probe --version
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_VERSION: v1.25.0
      - run: ./probe --allow-host localhost --allow-action shell e2e/workflow.yml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # go fix rewrites code to what the Go version in go.mod has, such as
      # maps.Copy for a loop that copies a map. -diff prints the rewrites
      # instead of applying them, and fails when there is any: run go fix ./...
      # and commit what it changes.
      - name: go fix
        run: go fix -diff ./...

  # govulncheck fails on a vulnerability the code calls, in a module it
  # requires or in the standard library of the Go in go.mod, which releases
  # are built with: update the module, or the Go in go.mod.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
